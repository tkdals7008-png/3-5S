name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - ".clasp.json"
      - ".github/workflows/deploy-appsscript.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON secret is missing."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify Apps Script target
        run: clasp status

      - name: Push Code.gs to Apps Script
        run: clasp push --force

      - name: Redeploy active web app
        run: clasp deploy --deploymentId AKfycbwgEHiICS2ga2XCuVYppgEGCJgJ3rAjA2jnq8Qbk1-Ol7zpwe5r2wnSw00M-ovNEB2i --description "Auto deploy from GitHub"

      - name: Smoke test active web app
        shell: bash
        run: |
          URL="https://script.google.com/macros/s/AKfycbwgEHiICS2ga2XCuVYppgEGCJgJ3rAjA2jnq8Qbk1-Ol7zpwe5r2wnSw00M-ovNEB2i/exec"
          HTTP_CODE=$(curl -L -sS -o /tmp/webapp.out -w "%{http_code}" "$URL")
          echo "HTTP $HTTP_CODE"
          head -c 300 /tmp/webapp.out || true
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi
          if grep -qi "accounts.google.com\|ServiceLogin\|Sign in" /tmp/webapp.out; then
            echo "Web app requires Google sign-in; public GitHub Pages cannot read it."
            exit 1
          fi
