name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - ".clasp.json"
      - ".github/workflows/deploy-appsscript.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON secret is missing."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify Apps Script target
        run: clasp status

      - name: Push latest Apps Script source
        run: clasp push --force

      - name: Redeploy web app
        run: clasp deploy --deploymentId AKfycbwgEHiICS2ga2XCuVYppgEGCJgJ3rAjA2jnq8Qbk1-Ol7zpwe5r2wnSw00M-ovNEB2i --description "My Machine GitHub auto deploy"

      - name: Verify web app HTTP and API
        shell: bash
        run: |
          URL="https://script.google.com/macros/s/AKfycbwgEHiICS2ga2XCuVYppgEGCJgJ3rAjA2jnq8Qbk1-Ol7zpwe5r2wnSw00M-ovNEB2i/exec?action=get_items"
          HTTP_CODE=$(curl -L -sS -o /tmp/webapp.out -w "%{http_code}" "$URL")
          echo "HTTP $HTTP_CODE"
          head -c 600 /tmp/webapp.out || true
          echo
          test "$HTTP_CODE" = "200"
          grep -q '"status":"success"' /tmp/webapp.out
          grep -q '"items"' /tmp/webapp.out
