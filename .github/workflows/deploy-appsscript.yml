name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - ".clasp.json"
      - ".github/workflows/deploy-appsscript.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON secret is missing."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify Apps Script target
        run: clasp status

      - name: List existing deployments
        run: clasp deployments

      - name: Probe deployment URLs
        shell: bash
        run: |
          IDS=(
            AKfycbyVP-WKx0GKr0wJttzO2Divo6iRjD_Dz5JLei7CDAM
            AKfycbyKinMhIJuymuWzBGCXkpv9iYta3VMtc5MK9L3L0NEnFhRMJ9lhDYK0eLKL3NfTdrnI
            AKfycbzieiVRcf06FqaTn51XeeHpRAa7JBXkI65WsPfqJxnkEy372SHpnvt7wSXtu36ERy2D
            AKfycbwgEHiICS2ga2XCuVYppgEGCJgJ3rAjA2jnq8Qbk1-Ol7zpwe5r2wnSw00M-ovNEB2i
            AKfycbxQYl_w-kssptLidNo_bqeRNGjBUBXl0jJ4vXLVjmaBD55sjvcazM-kIAHOA3d_BVTR
            AKfycbwdOumVoLFnNd4JuW66wHDPh2byKU7dt4cKePXzQHrbp5pnU04hl2u_MNGaWHGdJi2w
            AKfycbygo73HP2KmbxLwMQmPAD4RYvCDphQmWgKTO3w8agJEEleoNm-LY2GamKhlsADqzVaF
            AKfycbxzcRA1coVbTQZHRGHee5VofmcsLhKnC0XS9ao8CeZ_yfILDAJ6bXHLsKlQ1DVy9Aed
            AKfycbyxuv2NP8ShagooGBBHyPPjx_oJTuhZNOsClPKlgZjTgngX_85_26c_1TIzyfCpNR-P
          )
          for ID in "${IDS[@]}"; do
            URL="https://script.google.com/macros/s/$ID/exec"
            CODE=$(curl -L -sS -o /tmp/out -w "%{http_code}" "$URL" || true)
            PREFIX=$(head -c 120 /tmp/out | tr '\n' ' ' || true)
            echo "$ID -> HTTP $CODE :: $PREFIX"
          done

      - name: Push Code.gs to Apps Script
        run: clasp push --force
