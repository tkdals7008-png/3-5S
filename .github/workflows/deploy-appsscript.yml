name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-appsscript.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Inspect manifest from known working version 13
        shell: bash
        run: |
          rm -rf apps-script
          mkdir -p apps-script
          clasp pull --versionNumber 13
          echo '--- appsscript.json from version 13 ---'
          cat apps-script/appsscript.json
