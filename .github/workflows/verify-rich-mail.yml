name: Verify Rich Mail

on:
  push:
    paths:
      - "admin_mail_rich.js"
      - "admin_final_patch.js"
      - "admin.html"
      - "apps-script/Code.gs"
      - "apps-script/RichMail.gs"
      - ".github/workflows/verify-rich-mail.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check admin_mail_rich.js
          node --check admin_final_patch.js
      - name: Check Apps Script JavaScript syntax
        run: |
          cp apps-script/Code.gs /tmp/Code.js
          cp apps-script/RichMail.gs /tmp/RichMail.js
          cp apps-script/MailPermission.gs /tmp/MailPermission.js
          node --check /tmp/Code.js
          node --check /tmp/RichMail.js
          node --check /tmp/MailPermission.js
      - name: Verify final admin integration markers
        run: |
          grep -q "admin_final_patch.js" admin.html
          grep -q "admin_mail_rich.js" admin.html
          grep -q "2. 팀별 현황" admin_final_patch.js
          grep -q "3. 설비별 현황" admin_final_patch.js
          grep -q "ensureReportLibraries" admin_final_patch.js
          grep -q "sendRichReportEmail_" apps-script/Code.gs
          grep -q "inlineImages" apps-script/RichMail.gs
          grep -q "attachments" apps-script/RichMail.gs
