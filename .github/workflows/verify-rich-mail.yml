name: Verify Rich Mail

on:
  push:
    paths:
      - "admin_mail_rich.js"
      - "admin_final_patch.js"
      - "admin_na_patch.js"
      - "admin_ui_patch.js"
      - "admin_improvement_patch.js"
      - "admin.html"
      - "index.html"
      - "index_loader.js"
      - "index_app.js"
      - "index_na_patch.js"
      - "apps-script/Code.gs"
      - "apps-script/RichMail.gs"
      - ".github/workflows/verify-rich-mail.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check admin_mail_rich.js
          node --check admin_final_patch.js
          node --check admin_na_patch.js
          node --check admin_ui_patch.js
          node --check admin_improvement_patch.js
          node --check index_loader.js
          node --check index_app.js
          node --check index_na_patch.js
      - name: Check Apps Script JavaScript syntax
        run: |
          cp apps-script/Code.gs /tmp/Code.js
          cp apps-script/RichMail.gs /tmp/RichMail.js
          cp apps-script/MailPermission.gs /tmp/MailPermission.js
          node --check /tmp/Code.js
          node --check /tmp/RichMail.js
          node --check /tmp/MailPermission.js
      - name: Verify final integration markers
        run: |
          grep -q "admin_final_patch.js" admin.html
          grep -q "admin_na_patch.js" admin.html
          grep -q "admin_ui_patch.js" admin.html
          grep -q "admin_improvement_patch.js" admin.html
          grep -q "admin_mail_rich.js" admin.html
          grep -q "index_na_patch.js" index_loader.js
          grep -q "value=\"N/A\"" index_na_patch.js
          grep -q "n===7" index_na_patch.js
          grep -q "localToday" index_na_patch.js
          grep -q "localToday" admin_ui_patch.js
          grep -q "moveSampleButton" admin_ui_patch.js
          grep -q "applicableCount" admin_na_patch.js
          grep -q "a.type!=='na'" admin_na_patch.js
          grep -q "white-space:nowrap" admin_na_patch.js
          grep -q "nth-child(5).*text-align:left" admin_na_patch.js
          grep -q "#reportContent table thead th" admin_improvement_patch.js
          grep -q "#requestBody td:nth-child(4).*text-align:left" admin_improvement_patch.js
          grep -q "개선전" admin_improvement_patch.js
          grep -q "개선후" admin_improvement_patch.js
          grep -q "update_admin" admin_improvement_patch.js
          grep -q "사진 저장 + 완료" admin_improvement_patch.js
          grep -q "MM_REQ_ADMIN_V1" admin_improvement_patch.js
          grep -q "2. 팀별 현황" admin_final_patch.js
          grep -q "3. 설비별 현황" admin_final_patch.js
          grep -q "ensureReportLibraries" admin_final_patch.js
          grep -q "sendRichReportEmail_" apps-script/Code.gs
          grep -q "inlineImages" apps-script/RichMail.gs
          grep -q "attachments" apps-script/RichMail.gs
