name: Validate PC report
on:
  push:
    branches: [feature/automatic-full-report, 'fix/**']
    paths: ['admin*.js', 'admin*.html', 'apps-script/**', 'report-renderer/**', '.github/workflows/validate-pc-report.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix report-renderer
      - run: node --test report-renderer/test.mjs
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node report-renderer/browser-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-pc-report
          path: qa-output/
          retention-days: 1
